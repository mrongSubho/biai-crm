name = "biai-crm"
main = "src/server/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "biaicrm.mrong.tech", custom_domain = true }
]

[triggers]
crons = ["*/5 * * * *"]

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "biai-crm-db"
database_id = "7c038dce-7ae2-48bb-9efa-5439cdc373a8"
migrations_dir = "./migrations"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
DEFAULT_TIMEZONE = "Asia/Dhaka"
WORKSPACE_ID = "ws_biai_main"
ALLOWED_ORIGINS = "https://biaicrm.mrong.tech,https://biaileads.mrong.tech,http://localhost:5173,http://localhost:8787"
MFA_ENCRYPTION_KEY = "biai_mfa_enc_prod_89f3a9e145b208c901e8a27d3c8b4112"
META_APP_SECRET = "meta_demo_app_secret_biai_crm_2026"
META_WEBHOOK_VERIFY_TOKEN = "biai_meta_webhook_verify_token_2026"
META_WHATSAPP_TOKEN = "meta_demo_whatsapp_cloud_token_2026"
META_PHONE_NUMBER_ID = "109823746501928"

