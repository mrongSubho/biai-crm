name = "biai-crm"
main = "src/server/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "biaicrm.mrong.tech", custom_domain = true }
]

[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "biai-crm-db"
database_id = "7c038dce-7ae2-48bb-9efa-5439cdc373a8"
migrations_dir = "./migrations"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
DEFAULT_TIMEZONE = "Asia/Dhaka"
WORKSPACE_ID = "ws_biai_main"
ALLOWED_ORIGINS = "https://biaicrm.mrong.tech,https://biaileads.mrong.tech"
